<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NTE Repositório 3D - IFES Nova Venécia</title>

  <link rel="icon" sizes="16x16" href="img/logos/favicon32.png">

  <link rel="stylesheet" href="css/style.css">

</head>

<body>

  <!-- =========================
       HEADER
  ========================== -->

  <header class="topo">

    <div class="topo-container">

      <div class="logo-area">

          <a
            href="https://novavenecia.ifes.edu.br/"
            target="_blank"
            rel="noopener noreferrer"
            class="logo-link"
            aria-label="Visitar o site do IFES Campus Nova Venécia"
          >
            <img
              src="img/logos/logo-nte-nv1.png"
              alt="IFES Campus Nova Venécia"
            >
          </a>


</div>


    </div>

    
  </header>


  <!-- =========================
       FILTROS DE BUSCA
  ========================== -->

  <div class="filtros">

    <input
      type="text"
      id="busca"
      placeholder="🔎 Buscar modelos..."
      aria-label="Buscar modelos"
    >

    <select
      id="categoria"
      aria-label="Filtrar por disciplina"
    >
      <option value="todas">Todas as disciplinas</option>
    </select>

  </div>


  <!-- =========================
       GALERIA
  ========================== -->

  <main class="container">

    <div id="gallery" class="gallery">

    </div>

  </main>


  <script src="js/script.js"></script>

</body>

</html>
